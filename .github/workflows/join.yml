# Join rendered parts and untouched source clips into one video on GitHub
# runners, not on her laptop (2026-10-08, ColoristPRO webinar loop).
# Parts live as assets of a private release. Push join/<tag>.json =
# {"release": "...", "parts": ["promo.mp4", "clip.mov", ...], "loudnorm": ["clip.mov"], "out": "NAME.mp4"}
# Every part is scaled/padded to 1920x1080@30, audio to 48 kHz; parts listed in
# "loudnorm" are brought to -16 LUFS (renders are already there).
name: join
on:
  push:
    branches: [asr-inbox]
    paths: ["join/**"]
permissions:
  contents: read
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq
      - id: j
        run: |
          f=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- join/ | head -1)
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "out=$(jq -r .out "$f")" >> "$GITHUB_OUTPUT"
      - run: |
          f="${{ steps.j.outputs.file }}"
          rel=$(jq -r .release "$f")
          mkdir -p parts out
          jq -r '.parts[]' "$f" | sort -u | while read -r p; do
            gh release download "$rel" --repo ${{ github.repository }} -p "$p" -D parts
          done
          args=(); fc=""; i=0
          while read -r p; do
            args+=(-i "parts/$p")
            norm=$(jq -r --arg p "$p" '(.loudnorm // []) | index($p) != null' "$f")
            an="aresample=48000,aformat=channel_layouts=stereo"
            [ "$norm" = "true" ] && an="$an,loudnorm=I=-16:TP=-1.5:LRA=11,aresample=48000"
            fc+="[$i:v]scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=0x0A0A0A,fps=30,setsar=1,format=yuv420p[v$i];"
            fc+="[$i:a]$an,afade=t=in:d=0.03[a$i];"
            i=$((i+1))
          done < <(jq -r '.parts[]' "$f")
          for k in $(seq 0 $((i-1))); do fc+="[v$k][a$k]"; done
          fc+="concat=n=$i:v=1:a=1[v][a]"
          ffmpeg -v warning -y "${args[@]}" -filter_complex "$fc" -map "[v]" -map "[a]" \
            -c:v libx264 -preset medium -crf 18 -profile:v high -pix_fmt yuv420p -r 30 \
            -c:a aac -b:a 192k -ar 48000 -movflags +faststart "out/${{ steps.j.outputs.out }}"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "out/${{ steps.j.outputs.out }}"
      - uses: actions/upload-artifact@v4
        with:
          name: join-${{ github.sha }}
          path: out/
          compression-level: 0
