<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <title>Reel 41 — незапланований рілс</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
    @font-face {
      font-family: "ProductSans";
      src: url("assets/fonts/ProductSans-Black.woff") format("woff");
      font-weight: 900; font-style: normal; font-display: block;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #root { position: relative; width: 1080px; height: 1920px;
            overflow: hidden; background: #000;
            font-family: "ProductSans", system-ui, sans-serif;
      --surface:        #fffcfd;
      --container:      #fbeef2;
      --container-high: #f4dfe5;
      --graphite:       rgba(23,20,28,0.13);
      --accent:         #b4122f;
      --accent-deep:    #8d0d24;
      --pink:           #ff6e9c;
      --ink:            #17141c;

      --lit:        linear-gradient(115deg, #ffffff 0%, #fafafb 100%);
      --lit-blush:  linear-gradient(115deg, #ffffff 0%, #fff7fa 100%);
      --lit-accent: linear-gradient(115deg, #c41434 0%, #8d0d24 100%);
      --lit-pink:   linear-gradient(115deg, #ff8ab0 0%, #ff5c8f 100%);
      --lit-ink:    linear-gradient(115deg, #241f2c 0%, #17141c 100%);

      --rim: inset 0 1.5px 0 rgba(255,255,255,0.92),
             inset 0 -1.5px 0 rgba(255,255,255,0.14),
             inset 0 0 0 1px rgba(255,255,255,0.28);
      --rim-dark: inset 0 1.5px 0 rgba(255,255,255,0.16),
                  inset 0 0 0 1px rgba(255,255,255,0.08);
      --rim-glass: inset 0 2px 0 rgba(255,255,255,0.70),
                   inset 0 -2px 0 rgba(255,255,255,0.10),
                   inset 0 0 0 1.5px rgba(255,255,255,0.30);

      /* §5a.10 — glow wraps the silhouette, zero offset, three layers.
         Light coming off the object, not the object sitting on a surface. */
      --glow: drop-shadow(0 0 10px rgba(255,196,218,0.95))
              drop-shadow(0 0 26px rgba(255,110,156,0.85))
              drop-shadow(0 0 64px rgba(255,110,156,0.55))
              drop-shadow(0 0 120px rgba(255,110,156,0.32));
      --glow-soft: drop-shadow(0 0 22px rgba(255,110,156,0.55))
                   drop-shadow(0 0 60px rgba(255,110,156,0.30));

      --cast: drop-shadow(0 1px 2px rgba(26,30,39,0.10))
              drop-shadow(0 24px 48px rgba(26,30,39,0.14));
      --cast-sm: drop-shadow(0 1px 2px rgba(26,30,39,0.08))
                 drop-shadow(0 12px 24px rgba(26,30,39,0.12));
 }
    .plate { position: absolute; inset: 0; width: 1080px; height: 1920px;
             object-fit: cover; }
    #scrim { position: absolute; left: 20px; top: 1247px;
             width: 1040px; height: 450px;
             background-image: url("assets/underlay.png");
             background-size: 100% 100%; background-repeat: no-repeat;
             opacity: 0; visibility: hidden; pointer-events: none; }
    .cap { position: absolute; left: 0; width: 1080px; top: 1413px;
           height: 118px; line-height: 118px; text-align: center;
           color: #fff; font-size: 90px; font-weight: 900;
           letter-spacing: -0.015em; white-space: nowrap;
           opacity: 0; visibility: hidden; }
    .cap.inv { color: var(--ink); }
    .g { position: absolute; left: 0; top: 40px; width: 1080px;
         height: 600px; opacity: 0; visibility: hidden; }
    .g.full { top: 0; height: 1920px; }

    /* §5a.9 — glass over her footage is the house look. Panels only; an
       edge-to-edge frosted ground blurs her out of her own reel. */
    .glass { background: rgba(255,255,255,0.15);
             -webkit-backdrop-filter: blur(24px) saturate(1.4);
             backdrop-filter: blur(24px) saturate(1.4);
             box-shadow: var(--rim); filter: var(--cast); }

    /* A takeover: a tinted pane laid ON the footage, with a real margin so it
       reads as an object rather than a blur applied to the video. */
    /* The inset pane is a *pane*: 44/64 margin so the footage shows past it,
       and corners, because a full-bleed hard-cornered rectangle is a bug she
       has reported. base_css() squircles it; this radius is the fallback. */
    .ground { position: absolute; left: 44px; top: 64px;
              width: 992px; height: 1792px; border-radius: 68px;
              background: linear-gradient(158deg, rgba(196,20,52,0.62) 0%,
                          rgba(141,13,36,0.70) 100%);
              -webkit-backdrop-filter: blur(30px) saturate(1.5);
              backdrop-filter: blur(30px) saturate(1.5);
              box-shadow: var(--rim-glass); filter: var(--cast); }

    .card { position: absolute; background: var(--lit-blush);
            filter: var(--cast); box-shadow: var(--rim); }
    .card.ink { background: var(--lit-ink); box-shadow: var(--rim-dark); }
    .card.accent { background: var(--lit-accent); box-shadow: var(--rim-dark); }

    .tile { position: absolute; display: grid; place-items: center;
            background: var(--lit-blush); filter: var(--cast);
            box-shadow: var(--rim); }

    /* §5a.3 — bar rhythm. One thick heading, then ragged body. Uniform bars
       read as a loading state; ragged ones read as an abstracted screen. */
    .ph { display: block; height: 66px; border-radius: 18px;
          background: var(--lit-accent); margin-bottom: 26px;
          box-shadow: var(--rim-dark); }
    .pr { display: block; height: 40px; border-radius: 12px;
          background: var(--graphite); margin-bottom: 18px; }
    .pr:nth-of-type(2) { width: 94%; }
    .pr:nth-of-type(3) { width: 71%; }
    .pr:nth-of-type(4) { width: 43%; }

    .phone { position: absolute; background: var(--lit-blush);
             overflow: hidden; filter: var(--cast); box-shadow: var(--rim); }
    .phone video, .phone img { width: 100%; height: 100%; object-fit: cover;
                               display: block; }

    /* a value in its own card — her reference's "big number" pattern, minus
       the label, because a graphic here carries no words */
    .valcard { position: absolute; background: rgba(255,255,255,0.16);
               -webkit-backdrop-filter: blur(16px) saturate(1.3);
               backdrop-filter: blur(16px) saturate(1.3);
               box-shadow: var(--rim-dark);
               display: grid; place-items: center; }
    .valcard span { color: #fff; font-weight: 900; letter-spacing: -0.04em; }

    .wire { fill: none; stroke-width: 20; stroke-linecap: round;
            filter: drop-shadow(0 8px 18px rgba(26,30,39,0.22)); }
    .node { fill: #fdf6f6; stroke: #b4122f; stroke-width: 16;
            filter: drop-shadow(0 10px 22px rgba(26,30,39,0.24)); }
    .node.hub { fill: #b4122f; stroke: #fff; }

    /* §5a.10 — the glow rides a WRAPPER, never the clipped element itself.
       clip-path is applied *after* filter, so a drop-shadow declared on the
       same element as the clip is cut away with everything else outside the
       silhouette and the object ends up with no light at all. Put the clip on
       the shape and the filter on its parent: the parent filters the already
       clipped bitmap, so the light traces the squircle and survives. */
    .lit { position: absolute; inset: 0; pointer-events: none;
           filter: var(--glow); }
    .lit.soft { filter: var(--glow-soft); }

    /* Emoji are images, never glyphs. The render runs on someone else's
       Chrome, so a literal 💩 in the HTML comes out in whatever emoji font
       that machine has — Noto on the cloud renderer, Segoe on hers, Apple on
       nobody's. She wants the Apple set, so the artwork ships in assets/emoji
       and the glyph never appears in a composition. */
    .emoji { display: block; width: auto; image-rendering: auto; }

    .halo { position: absolute; border-radius: 50%; pointer-events: none;
            background: radial-gradient(circle, rgba(255,110,156,0.5) 0%,
                        rgba(255,110,156,0) 70%); }
    .ring { position: absolute; border-radius: 50%; pointer-events: none;
            border: 18px solid rgba(255,110,156,0.92);
            filter: drop-shadow(0 0 40px rgba(255,110,156,0.55)); }

    /* ---- takeovers (STYLE.md 2c) ----
       The graphic owns the frame: the plate is gone, so none of the
       over-footage rules apply — no glow budget, no band discipline, ink type
       on a light ground. Lives here rather than per-reel because every reel
       from 9 onwards needs it. A takeover that does not bleed off at least
       two edges reads as a slide, not a takeover. */
    .tk { position: absolute; inset: 0; }
    .tk.paper { background: var(--surface); }
    .tk.white { background: #ffffff; }
    .tk.blush { background: linear-gradient(150deg,#ffffff 0%,#fffafc 55%,
                                            #fdf4f8 100%); }
    /* graph paper — the texture the reference takeovers all have. 60px cells
       at 5.8% ink: visible, never a pattern you read. */
    .gp { position: absolute; inset: 0;
          background-image:
            repeating-linear-gradient(0deg, rgba(23,20,28,.058) 0 1px,
                                      transparent 1px 60px),
            repeating-linear-gradient(90deg, rgba(23,20,28,.058) 0 1px,
                                      transparent 1px 60px); }
    /* horizontal rules only — a transcript or a list is ruled paper, not
       graph paper, and the difference is what makes it read as an export. */
    .gl { position: absolute; inset: 0;
          background-image:
            repeating-linear-gradient(0deg, rgba(23,20,28,.05) 0 1px,
                                      transparent 1px 175px); }

    /* the finished artefact, in her system — one class at any aspect ratio */
    .dk { position: absolute; overflow: hidden; border-radius: 28px;
          background: var(--lit-blush); box-shadow: var(--rim);
          filter: var(--cast); }
    .dk i { position: absolute; display: block; }
    .dk .hb { left: 30px; top: 30px; height: 20px; border-radius: 6px;
              background: var(--lit-accent); }
    .dk .rr { left: 30px; height: 9px; border-radius: 4px;
              background: rgba(23,20,28,0.22); }
    .dk .pb { border-radius: 16px; background: var(--lit-pink);
              box-shadow: var(--rim-dark); }

@font-face { font-family: "ProductSans"; src: url("assets/fonts/ProductSans-Regular.ttf"); font-weight: 400; font-display: block; }
@font-face { font-family: "ProductSans"; src: url("assets/fonts/ProductSans-Medium.ttf"); font-weight: 500; font-display: block; }
@font-face { font-family: "ProductSans"; src: url("assets/fonts/ProductSans-Bold.ttf"); font-weight: 700; font-display: block; }

/* ---------- the edge light: what makes a surface read as glass ----------
   A uniform stroke is 2013. Real glass catches light at two opposite corners
   and goes almost dark along the sides, so the rim is a gradient ring. */
.edge::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.6px;
  background: linear-gradient(140deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.34) 16%,
              rgba(255,255,255,0.05) 42%, rgba(255,255,255,0.07) 62%,
              rgba(255,255,255,0.50) 86%, rgba(255,255,255,0.90) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; z-index: 3; }

/* ---------- the shelf: frosted glass over her footage ----------
   The house look since reel 3, rebuilt in layers: blur + saturation, a faint
   top-to-bottom tint, light inside the bottom edge (thickness), huge soft
   shadow. Add .edge for the rim. */
.shelf { position: absolute; border-radius: 80px;
  background: linear-gradient(158deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.07) 50%,
              rgba(255,255,255,0.13) 100%);
  -webkit-backdrop-filter: blur(22px) saturate(1.7) brightness(1.05);
  backdrop-filter: blur(22px) saturate(1.7) brightness(1.05);
  box-shadow: inset 0 2px 1px rgba(255,255,255,0.65), inset 0 -24px 44px -22px rgba(255,255,255,0.36),
              0 44px 90px -34px rgba(24,4,12,0.5); }

/* dark glass — notifications and anything with white text over footage */
.dglass { position: absolute; border-radius: 64px; color: #fff;
  background: linear-gradient(160deg, rgba(58,22,32,0.58) 0%, rgba(24,10,15,0.50) 100%);
  -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
  box-shadow: inset 0 1.5px 1px rgba(255,255,255,0.30), inset 0 -16px 30px -16px rgba(255,255,255,0.14),
              0 40px 80px -30px rgba(10,0,4,0.6); }

/* ---------- the tile family: every mark lives in one of three ----------
   Same radius ratio as an iOS icon (22.4%), glyph at 50%. Put the tile in a
   sized wrapper; the wrapper takes the motion, the tile takes the material. */
.clear { position: absolute; inset: 0; border-radius: 22.4%;
  background: linear-gradient(158deg, rgba(255,255,255,0.36) 0%, rgba(255,255,255,0.11) 48%,
              rgba(255,255,255,0.17) 100%);
  box-shadow: inset 0 2px 1px rgba(255,255,255,0.70), inset 0 -18px 30px -14px rgba(255,255,255,0.42),
              0 34px 60px -22px rgba(24,4,12,0.55), 0 3px 8px rgba(24,4,12,0.10);
  display: flex; align-items: center; justify-content: center; }
.pearl { position: absolute; inset: 0; border-radius: 22.4%; overflow: hidden;
  background: linear-gradient(160deg, #ffffff 0%, #fff5f8 52%, #f5dfe6 100%);
  box-shadow: inset 0 2px 1px #fff, inset 0 -20px 32px -14px rgba(180,18,47,0.18),
              0 36px 64px -22px rgba(30,4,12,0.55), 0 3px 8px rgba(30,4,12,0.12);
  display: flex; align-items: center; justify-content: center; }
.jelly { position: absolute; inset: 0; border-radius: 22.4%; overflow: hidden;
  background: linear-gradient(165deg, #e0204b 0%, #ab112e 46%, #6b081c 100%);
  box-shadow: inset 0 2px 1px rgba(255,255,255,0.55), inset 0 -26px 40px -14px rgba(255,125,165,0.60),
              inset 0 0 0 1px rgba(255,255,255,0.10),
              0 36px 64px -22px rgba(70,4,20,0.62), 0 3px 8px rgba(70,4,20,0.14);
  display: flex; align-items: center; justify-content: center; }
/* the lens highlight — subtle, or it turns into 2009 gloss */
.jelly::after, .pearl::after { content: ""; position: absolute; left: 7%; right: 7%; top: 3.5%; height: 44%;
  border-radius: 40% 40% 50% 50% / 38% 38% 24% 24%;
  background: linear-gradient(180deg, rgba(255,255,255,0.26), rgba(255,255,255,0)); }
.pearl::after { background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0)); opacity: 0.5; }
.mk { width: 50%; height: 50%; fill: url(#gw); position: relative; z-index: 1; }
.pearl .mk { fill: #17141c; }
/* a wordmark stands in where a brand has no icon (RUTA, Windsor's "w.") */
.wmark { font-weight: 900; color: #17141c; letter-spacing: -0.045em; line-height: 1;
  position: relative; z-index: 1; }
.wmark i { font-style: normal; color: #b4122f; }
.jelly .wmark { color: #fff; } .jelly .wmark i { color: #ffb3c9; }

/* one light sweep across a surface when it lands — once, never looping */
.sheen { position: absolute; inset: -10%; z-index: 2; pointer-events: none;
  background: linear-gradient(105deg, rgba(255,255,255,0) 38%, rgba(255,255,255,0.75) 50%, rgba(255,255,255,0) 62%);
  mix-blend-mode: soft-light; }
/* a ripple the same shape as the tile that sent it */
.sqring { position: absolute; border-radius: 22.4%; border: 3px solid rgba(255,255,255,0.75);
  opacity: 0; visibility: hidden; }

/* ---------- the takeover ground: deep burgundy, lit from inside ----------
   Approved on the test: a dark ground is allowed now (it overrides §5's old
   "never dark"). Three soft light pools drift slowly; grain stops banding. */
.tkg { position: absolute; inset: 0;
  background: linear-gradient(172deg, #4a0a1c 0%, #660c26 36%, #3c0716 70%, #1d030a 100%); }
.aur { position: absolute; border-radius: 50%; pointer-events: none; }
.aur.a1 { left: 260px; top: -420px; width: 1200px; height: 1200px;
  background: radial-gradient(circle, rgba(255,110,156,0.50) 0%, rgba(255,110,156,0) 62%); }
.aur.a2 { left: -640px; top: 960px; width: 1400px; height: 1400px;
  background: radial-gradient(circle, rgba(222,32,74,0.55) 0%, rgba(222,32,74,0) 64%); }
.aur.a3 { left: 330px; top: 760px; width: 900px; height: 900px;
  background: radial-gradient(circle, rgba(255,198,214,0.20) 0%, rgba(255,198,214,0) 60%); }
.grain { position: absolute; inset: 0; background: url("assets/grain.png"); opacity: 0.075;
  mix-blend-mode: overlay; pointer-events: none; }

/* the white report card that sits on a burgundy ground */
.sheet { position: absolute; border-radius: 68px; overflow: hidden; color: #17141c;
  background: linear-gradient(172deg, #ffffff 0%, #fff9fb 55%, #fdf0f4 100%);
  box-shadow: inset 0 2px 1px #fff, inset 0 -30px 60px -30px rgba(180,18,47,0.14),
              0 70px 130px -40px rgba(8,0,3,0.75), 0 0 0 1px rgba(255,255,255,0.35); }
.sheet .sheen { mix-blend-mode: normal; opacity: 0.55; }
/* type ladder inside a sheet */
.t-micro { font-size: 24px; font-weight: 700; letter-spacing: 0.16em; color: rgba(23,20,28,0.42); }
.t-title { font-size: 42px; font-weight: 700; letter-spacing: -0.015em; }
.t-sub   { font-size: 26px; font-weight: 500; color: rgba(23,20,28,0.46); }
.t-big   { font-size: 176px; font-weight: 900; letter-spacing: -0.045em; line-height: 1;
  background: linear-gradient(118deg, #7e0b20 0%, #b4122f 42%, #ff6e9c 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 10px; }
.chip { display: inline-flex; align-items: center; gap: 10px; height: 58px; padding: 0 24px;
  border-radius: 29px; background: #fbe3ea; color: #b4122f; font-size: 26px; font-weight: 700; }
.hair { height: 2px; background: rgba(23,20,28,0.07); transform-origin: 0 0; }

/* a cable between two tiles: a glass tube, a bright core, a travelling packet */
.cab .tube { fill: none; stroke: rgba(255,255,255,0.26); stroke-width: 20; stroke-linecap: round; }
.cab .core { fill: none; stroke: rgba(255,255,255,0.92); stroke-width: 4.5; stroke-linecap: round; }
.cab .pkt  { fill: none; stroke: #ffd6e3; stroke-width: 11; stroke-linecap: round; }
.cab .pkg  { filter: drop-shadow(0 0 10px rgba(255,120,165,1)); }
.cab .wire { fill: none; stroke: rgba(255,255,255,0.55); stroke-width: 4; stroke-linecap: round; }


.abs { position: absolute; }
.hide { opacity: 0; visibility: hidden; }
.tw { position: absolute; }
.sk { fill: none; stroke: url(#gw); stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round;
  width: 50%; height: 50%; position: relative; z-index: 1; overflow: visible; }
.dots { position: absolute; left: 0; right: 0; top: 47%; display: flex; justify-content: center; gap: 13px; z-index: 2; }
.dots i { display: block; width: 15px; height: 15px; border-radius: 50%; background: #ffd6e3; }
.bdg { position: absolute; width: 104px; height: 104px; border-radius: 50%; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #ffffff 0%, #fff5f8 52%, #f5dfe6 100%);
  box-shadow: inset 0 2px 1px #fff, 0 22px 40px -14px rgba(30,4,12,0.6); }
.bk { width: 58%; height: 58%; fill: none; stroke: #b4122f; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.bdg.ok { background: linear-gradient(165deg, #ff6e9c 0%, #e0204b 55%, #8d0d24 100%);
  box-shadow: inset 0 2px 1px rgba(255,255,255,0.6), 0 0 0 7px rgba(255,255,255,0.85), 0 0 40px 8px rgba(255,110,156,0.7); }
.bdg.ok .bk { stroke: #fff; }
.half { position: absolute; }

/* the content plan */
.cal { position: absolute; left: 70px; top: 300px; width: 940px; height: 820px; }
.cal .hd { position: absolute; left: 56px; top: 54px; }
.cal .dow { position: absolute; top: 150px; width: 112px; text-align: center; font-size: 24px;
  font-weight: 700; letter-spacing: 0.1em; color: rgba(23,20,28,0.62); }
.cell { position: absolute; width: 112px; height: 272px; border-radius: 30px;
  background: linear-gradient(170deg, #fdf6f6 0%, #f8e8ec 100%);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.9); }
.cell b { position: absolute; left: 0; right: 0; top: 18px; text-align: center; font-size: 34px;
  font-weight: 700; color: rgba(23,20,28,0.72); }
.cell.today { background: #fff; box-shadow: inset 0 0 0 5px #b4122f; }
.cell.today b { color: #b4122f; }
.rc { position: absolute; left: 14px; top: 84px; width: 84px; height: 150px; border-radius: 22px;
  background: linear-gradient(165deg, #f7c9d6 0%, #eaa8bb 100%);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; }
.rc svg { width: 46%; height: 46%; fill: #fff; stroke: none; }
.ring2 { position: absolute; border-radius: 34px; border: 5px solid #ff6e9c; opacity: 0; visibility: hidden; }

/* the reel card: a tall jelly tile with a play glyph */
.reel .jelly { border-radius: 52px; }
.reel .sheen { border-radius: 52px; }
.reel svg.pl { width: 44%; height: 44%; fill: url(#gw); position: relative; z-index: 1; }

    <div id="root" data-composition-id="main" data-start="0"
         data-width="1080" data-height="1920" data-duration="6.383" data-fps="30">

      <video id="vid" class="plate" src="assets/base.mp4"
             data-start="0" data-duration="6.383" data-media-start="0"
