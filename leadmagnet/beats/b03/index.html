<!doctype html>
<html lang="uk"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/>
<script src="assets/gsap.min.js"></script><script src="assets/rough.js"></script>
<link rel="stylesheet" href="assets/excalifont.css"/><link rel="stylesheet" href="assets/lib.css"/>
<script src="assets/lib.js"></script>
</head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8.000" data-width="1920" data-height="1080">
  <div id="bg" class="clip none" data-start="0" data-duration="8.000" style="opacity:0"></div>
  <div id="stage" class="clip" data-start="0" data-duration="8.000">
    <svg id="ex" width="1920" height="1080"></svg>
    <div class="lower" id="lt" style="left:auto;right:90px;bottom:150px"><small>щотижня</small>10–15 рілсів</div>
  </div>
  <div id="camring"></div>
  <video id="cam" class="clip" src="cam.mp4" data-start="0" data-duration="8.000" data-media-start="0" muted playsinline></video>
  <div id="dim" class="clip" data-start="0" data-duration="8.000"></div>
  <div id="flash" class="clip" data-start="0" data-duration="8.000"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
LM.camSet("full");

LM.rise(tl,"#lt",0.6); LM.fadeOut(tl,"#lt",7.0,0.5);
tl.set({}, {}, 8.000);
window.__timelines["main"] = tl;
</script></body></html>
