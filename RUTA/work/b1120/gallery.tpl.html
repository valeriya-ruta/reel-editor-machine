<title>Reels 41–56</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Caveat:wght@600;700&display=swap">
<style>
/* layout: a whiteboard wall — dot-grid ground, phone-shaped reels pinned in a wrapping grid */
:root {
  --bg: #ffffff; --dot: rgba(30,30,30,.13); --ink: #1e1e1e; --sub: #5f6368; --card: #ffffff;
  --line: #dadce0; --wait: #f1f3f4; --ok-bg: #c4eed0; --ok-fg: #072711; --blue: #4285F4; --red: #EA4335;
  --yellow: #FBBC04; --green: #34A853; --shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15);
  --sans: "Google Sans", "Roboto", system-ui, sans-serif; --hand: "Caveat", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17181a; --dot: rgba(255,255,255,.10); --ink: #e8eaed; --sub: #9aa0a6; --card: #23252a;
  --line: #3c4043; --wait: #2c2f33; --ok-bg: #0f5223; --ok-fg: #c4eed0; --shadow: 0 1px 3px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17181a; --dot: rgba(255,255,255,.10); --ink: #e8eaed; --sub: #9aa0a6; --card: #23252a;
  --line: #3c4043; --wait: #2c2f33; --ok-bg: #0f5223; --ok-fg: #c4eed0; --shadow: 0 1px 3px rgba(0,0,0,.5); color-scheme: dark; }
body { background-color: var(--bg); color: var(--ink); font-family: var(--sans);
  background-image: radial-gradient(circle, var(--dot) 1.4px, transparent 1.8px); background-size: 28px 28px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 40px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 28px; }
h1 { font-family: var(--hand); font-weight: 700; font-size: clamp(42px, 7vw, 64px); line-height: 1; margin: 0; position: relative; }
h1 svg { position: absolute; left: 0; bottom: -12px; width: 100%; height: 16px; overflow: visible; }
.lede { margin: 18px 0 0; color: var(--sub); font-size: 16px; max-width: 60ch; line-height: 1.5; }
.count { font-size: 15px; color: var(--sub); display: flex; align-items: center; gap: 10px; }
.count b { font-size: 28px; color: var(--ink); font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 22px; }
.card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.frame { aspect-ratio: 9 / 16; max-width: 100%; background: #000; }
.frame video { width: 100%; height: 100%; display: block; object-fit: cover; background: #000; }
.wait { width: 100%; height: 100%; background: var(--wait); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--sub); font-family: var(--hand); font-size: 26px; }
.dots { display: flex; gap: 8px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; display: block; animation: hop 1.4s ease-in-out infinite; }
.dots i:nth-child(1) { background: var(--blue); } .dots i:nth-child(2) { background: var(--red); animation-delay: .12s; }
.dots i:nth-child(3) { background: var(--yellow); animation-delay: .24s; } .dots i:nth-child(4) { background: var(--green); animation-delay: .36s; }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-9px); } }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; } }
.meta { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.num { font-family: var(--hand); font-size: 30px; font-weight: 700; line-height: 1; }
.st { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); color: var(--sub); white-space: nowrap; font-variant-numeric: tabular-nums; }
.st.ok { background: var(--ok-bg); border-color: var(--ok-bg); color: var(--ok-fg); }
h2 { margin: 0; font-size: 16px; font-weight: 500; line-height: 1.3; text-wrap: balance; }
.when { margin: 0; font-size: 13px; color: var(--sub); }
</style>
<div class="wrap">
  <header>
    <div>
      <h1>Рілси 41–56<svg viewBox="0 0 300 16" preserveAspectRatio="none" aria-hidden="true"><path d="M2 9 C 80 4, 160 13, 298 6" fill="none" stroke="#EA4335" stroke-width="4" stroke-linecap="round"/></svg></h1>
      <p class="lede">Партія з 20 листопада у стилі Google × Excalidraw. Готові рілси можна дивитись тут; ті, що ще монтуються, з’являться на цій сторінці.</p>
    </div>
    <div class="count"><b>{{DONE}}</b> / 16 готово</div>
  </header>
  <main class="grid">
{{CARDS}}
  </main>
</div>
